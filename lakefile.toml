name = "Reachability"
version = "0.1.2"
license = "Apache-2.0"
description = "Verified, kernel-reducible reachability and shortest walks for finite directed graphs"
keywords = ["graph-theory", "reachability", "breadth-first-search", "mathlib"]
defaultTargets = ["Reachability"]
testDriver = "Test"

[[lean_lib]]
name = "Reachability"
srcDir = "src"
globs = ["Reachability", "Reachability.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Bench"
srcDir = "bench"
globs = ["Bench.+"]

[[lean_lib]]
name = "Test"
srcDir = "test"
